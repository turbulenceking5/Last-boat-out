<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A turn-based zombie outbreak command game: hold the line, move your army and get Vessmark's people onto the last ships.">
<meta name="theme-color" content="#13171a">
<title>Last Boat to Calder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a general's war-room. The paper atlas of Vessmark is the table; the dark field kit beside it holds orders, the selected place and the dispatch log. On a phone the map becomes a pannable window with a sticky command bar. One deliberate dark look. */
:root{
  color-scheme: dark;
  --bg:#13171a; --panel:#1c2326; --panel-2:#252e32; --line:rgba(226,220,200,.13);
  --ink:#e4dfcf; --muted:#98a096; --paper:#cdc7af; --map-ink:#3a3c31;
  --amber:#e2a23a; --blood:#c4432f; --moss:#6f8a55; --sea:#71898c; --good:#8fb27a; --troop:#3d5a78;
  --font-display:'Special Elite','Courier New',monospace;
  --font-ui:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-ui);padding-inline:16px;padding-block:14px 32px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.brand{font:22px/1 var(--font-display);white-space:nowrap}
.brand small{display:block;font:600 11px/1.4 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.stat{display:flex;flex-direction:column;min-width:0}
.stat span{font:600 11px var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.stat b{font:600 17px var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.good{color:var(--good)}.bad{color:#ec9a8b}.warn{color:var(--amber)}
.cp{display:flex;gap:4px;margin-top:4px}
.cp i{width:14px;height:14px;border-radius:2px;border:1.5px solid var(--amber)}
.cp i.on{background:var(--amber)}
.cp i.gone{border-color:#555;border-style:dashed}
.gauge{width:84px}
.gauge .tr{height:7px;background:rgba(0,0,0,.4);border-radius:2px;overflow:hidden;margin-top:5px}
.gauge .fl{height:100%;background:var(--good)}
.gauge .fl.mid{background:var(--amber)}.gauge .fl.low{background:var(--blood)}
.spacer{flex:1}
.topbtns{display:flex;gap:6px;align-items:center}
.endturn{background:var(--amber);color:#1b1608;border:0;border-radius:4px;padding:10px 18px;font-weight:700;letter-spacing:.04em}
.endturn small{display:block;font:500 11px var(--font-num);opacity:.8}

.ticker{display:flex;gap:10px;align-items:baseline;background:#0f1214;border:1px solid var(--line);border-radius:6px;padding:8px 14px;min-width:0}
.ticker .tag{font:600 11px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--blood);padding:2px 6px;border-radius:2px;white-space:nowrap}
.ticker p{margin:0;font:14px/1.4 var(--font-display);min-width:0;flex:1}

.main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(330px,1fr);gap:12px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}
.mapbox{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.mapscroll{overflow:auto;border-radius:3px;max-width:100%;background:var(--sea);-webkit-overflow-scrolling:touch}
svg.map{display:block;height:auto;touch-action:manipulation;background:var(--sea)}
.mapwrap{position:relative;min-width:0}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zoom button{width:34px;height:34px;border-radius:4px;border:1px solid rgba(0,0,0,.35);background:rgba(28,35,38,.85);font-weight:700;font-size:18px;line-height:1}
.land{fill:var(--paper);stroke:#58584a;stroke-width:1.5}
.coastline{fill:none;stroke:#e6e1cf;stroke-opacity:.35;stroke-width:1.2}
.grid{stroke:var(--map-ink);stroke-opacity:.07}
.tree{fill:var(--moss);fill-opacity:.45}
.river{fill:none;stroke:#7d9799;stroke-width:4;stroke-linecap:round}
.contour{fill:none;stroke:#7a6e4f;stroke-opacity:.3}
.road{stroke:#7a6646;stroke-width:2.6;stroke-linecap:round}
.rail{stroke:#3a3c31;stroke-width:4}
.rail-tie{stroke:var(--paper);stroke-width:2;stroke-dasharray:3 6}
.cut{stroke:var(--blood);stroke-width:3;stroke-dasharray:5 5}
.cutx{stroke:var(--blood);stroke-width:3.5;stroke-linecap:round}
.edge-hit{stroke:transparent;stroke-width:22;cursor:pointer}
.edge-pick{stroke:var(--amber);stroke-width:6;stroke-opacity:.9}
.route{fill:none;stroke:#3f7d2c;stroke-width:5;stroke-dasharray:2 7;stroke-linecap:round;opacity:.9}
.flow{stroke:#a3301f;stroke-width:3;fill:none;marker-end:url(#arr)}
.flowlbl{font:700 12px var(--font-num);fill:#8e2414;paint-order:stroke;stroke:var(--paper);stroke-width:3.5}
#arr path{fill:#a3301f}
#carr path{fill:#2c3a24}
.node{cursor:pointer}
.node:focus,.edge-hit:focus{outline:none}
.node .focusring{fill:none;stroke:none}
.node:focus-visible .focusring{stroke:#1b1608;stroke-width:6;stroke-opacity:.85}
.node:focus-visible .focusring+.focusring{stroke:var(--amber);stroke-width:3;stroke-opacity:1}
.edge-hit:focus-visible{stroke:var(--amber);stroke-opacity:.55;stroke-width:12}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.node .disc{stroke:var(--map-ink);stroke-width:2}
.node.secure .disc{fill:#f0ead6}
.node.threat .disc{fill:#e9c76b}
.node.holding .disc{fill:#eaa05e}
.node.losing .disc{fill:#d0532c}
.node.fallen .disc{fill:#24231f}
.node.cleared .disc{fill:#9a9686}
.node .horde{fill:var(--blood);fill-opacity:.22;stroke:var(--blood);stroke-width:2}
.node .sel{fill:none;stroke:var(--amber);stroke-width:3.5}
.node .target{fill:none;stroke:var(--amber);stroke-width:2.5;stroke-dasharray:4 4}
.node .spark{fill:none;stroke:#a3301f;stroke-width:2;stroke-dasharray:2 4}
.node .sparkmark{font:700 15px var(--font-num);fill:#a3301f;paint-order:stroke;stroke:var(--paper);stroke-width:3}
.node text.name{font:700 16px var(--font-ui);fill:var(--map-ink);paint-order:stroke;stroke:var(--paper);stroke-width:5;stroke-linejoin:round}
.node text.sub{font:600 12.5px var(--font-num);fill:#4b4a3c;paint-order:stroke;stroke:var(--paper);stroke-width:5;stroke-linejoin:round}
.node text.sub tspan.inf{fill:#a3301f}
.node .badge rect{fill:var(--troop);stroke:#1c2a38;stroke-width:1.2}
.node .badge text{font:700 12px var(--font-num);fill:#fff}
.node .portmark{fill:none;stroke:var(--map-ink);stroke-width:2}
.node .evac{fill:var(--good);stroke:#2c3a24;stroke-width:1.2}
.col line{stroke:#2c3a24;stroke-width:2.5;marker-end:url(#carr)}
.col circle{fill:#fff;stroke:#2c3a24;stroke-width:1.5}
.col text{font:700 11px var(--font-num);fill:#20301a;paint-order:stroke;stroke:#fff;stroke-width:3}
.label-small{font:11px var(--font-display);fill:var(--map-ink);opacity:.75}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 6px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:18px;height:14px;flex:none}
.modebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:#3a2f17;border:1px solid var(--amber);border-radius:4px}
.modebar p{margin:0;flex:1;min-width:200px}

.btn{background:var(--panel-2);border:1px solid rgba(226,220,200,.22);border-radius:4px;padding:7px 12px;font-weight:600;line-height:1.2;text-align:left;min-height:36px}
.btn:hover:not(:disabled){border-color:var(--amber)}
.btn:disabled{color:rgba(228,223,207,.5);background:rgba(37,46,50,.6);cursor:not-allowed;border-style:dashed}
.btn small.why{color:#f0b9ad;opacity:1} /* why a disabled order can't be given: kept at full contrast */
.btn.primary{background:var(--amber);color:#1b1608;border-color:var(--amber)}
.btn.on{border-color:var(--good);color:var(--good)}
.btn.icon{min-width:36px;text-align:center;padding:7px 10px}
.btn small{display:block;font:500 11px var(--font-num);opacity:.8;margin-top:2px}

.side{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-width:0}
.sec{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sec:last-child{border-bottom:0}
.sec.report{background:rgba(226,162,58,.06)}
.label{font:600 11px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.place h2{margin:0;font:26px/1.1 var(--font-display);text-wrap:balance}
.place .kind{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.state{font:600 11px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:2px;color:#15130c;white-space:nowrap}
.state.secure{background:#d9d2b8}.state.threat{background:#e9c76b}.state.holding{background:#eaa05e}.state.losing{background:#d0532c;color:#fff}.state.fallen{background:#000;color:#ddd;border:1px solid #555}.state.cleared{background:#9a9686}.state.evac{background:var(--good)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px}
.facts div{background:rgba(0,0,0,.22);border-radius:4px;padding:6px 8px;min-width:0}
.facts b{display:block;font:600 17px var(--font-num)}
.facts span{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.note{font-size:13px;color:var(--muted);margin:0}
.callout{font-size:13.5px;margin:0;padding:7px 9px;border-radius:4px;background:rgba(0,0,0,.22);border-left:3px solid var(--amber)}
.callout.bad{border-left-color:var(--blood);color:#efb2a6}
.callout.good{border-left-color:var(--good);color:#c4dcb2}
.amts{display:flex;gap:6px;flex-wrap:wrap}
.sitlist{display:flex;flex-direction:column;gap:4px}
.sitlist button{display:flex;justify-content:space-between;gap:8px;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:4px;padding:7px 9px;text-align:left;flex-wrap:wrap;min-height:36px}
.sitlist button:hover{border-color:var(--amber)}
.sitlist em{font-style:normal;font:600 12px var(--font-num);color:var(--muted)}
.sitlist em.bad{color:#ec9a8b}
.replist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.replist li.bad{color:#eaa092}.replist li.good{color:#b8d4a3}.replist li.key{color:var(--amber)}
.log{list-style:none;margin:0;padding:0;max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
.log li{font:13.5px/1.45 var(--font-display);color:#d3cdbb}
.log li time{font:600 11px var(--font-num);color:var(--muted);margin-right:6px}
.log li.bad{color:#eaa092}.log li.good{color:#b8d4a3}.log li.key{color:var(--amber)}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:var(--amber)}

.overlay[hidden]{display:none}
.overlay{position:fixed;inset:0;background:rgba(6,8,10,.78);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;overflow-y:auto}
.card{background:var(--panel);border:1px solid rgba(226,220,200,.25);border-radius:6px;width:min(680px,100%);padding:20px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow-y:auto}
.card .eyebrow{font:600 12px var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.card.red{border-color:var(--blood)}.card.red .eyebrow{color:#f0a093}
.card h2{margin:0;font:28px/1.1 var(--font-display);text-wrap:balance}
.card h3{margin:4px 0 0;font:600 12px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card p.body{font:16px/1.6 var(--font-display);margin:0;color:#e9e3cf}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.card ul li{font-size:14.5px}
.card ul li.bad{color:#eaa092}.card ul li.good{color:#b8d4a3}.card ul li.key{color:var(--amber)}
.choices{display:flex;flex-direction:column;gap:6px}
.choices .btn{padding:10px 12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .btn{flex:1 1 150px}
.seg .btn[aria-pressed="true"]{border-color:var(--amber);background:#3a2f17}
.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field input{background:var(--panel-2);border:1px solid rgba(226,220,200,.25);border-radius:4px;padding:8px 10px;width:12em;font-family:var(--font-num)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stats div{background:rgba(0,0,0,.25);border-radius:4px;padding:8px 10px}
.stats b{display:block;font:600 22px var(--font-num)}
.stats span{font-size:12px;color:var(--muted);letter-spacing:.06em}
.medals{display:flex;flex-wrap:wrap;gap:6px}
.medal{font-size:13px;padding:4px 9px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.medal.won{border-color:var(--amber);color:var(--amber);background:#3a2f17}
.helpgrid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:0}
.helpgrid dt{font:600 13px var(--font-num);color:var(--amber)}
.helpgrid dd{margin:0}

/* phone: sticky command bar and a bottom sheet for orders */
.cmdbar,.sheet{display:none}
@media (max-width:700px){
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .top .endturn,.top .hide-sm{display:none}
  .mapscroll{max-height:62vh}
  .cmdbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;gap:8px;align-items:center;background:var(--panel);border-top:1px solid rgba(226,220,200,.25);padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .cmdbar .msg{flex:1;min-width:0;font-size:13px;line-height:1.3}
  .cmdbar .endturn{padding:10px 14px}
  .sheet{display:flex;flex-direction:column;position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));max-height:58vh;overflow-y:auto;z-index:39;background:var(--panel);border-top:2px solid var(--amber);border-radius:10px 10px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
  .sheet[hidden]{display:none}
  .side .placewrap{display:none}
  #modebar{display:none} /* the command bar already shows the same instructions */
  /* touch: keep every tap target at least 44px */
  .btn,.sitlist button{min-height:44px}
  .btn.icon{min-width:44px}
  .zoom button{width:44px;height:44px}
  .check{min-height:44px}
  .check input{width:22px;height:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <div class="ticker" id="ticker"></div>
  <div id="announce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="main">
    <section class="mapbox">
      <div id="modebar"></div>
      <div class="mapwrap"><div class="mapscroll" id="mapscroll">
        <svg class="map" id="map" viewBox="0 0 1000 700" role="group" aria-label="Operations map of Vessmark. Arrow keys move between places; Enter selects.">
          <defs>
            <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker>
            <marker id="carr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker>
          </defs>
          <g id="terrain" aria-hidden="true"></g><g id="edges"></g><g id="routes" aria-hidden="true"></g><g id="flows" aria-hidden="true"></g><g id="cols" aria-hidden="true"></g><g id="nodes"></g>
        </svg>
      </div>
      <div class="zoom"><button data-act="zoomin" aria-label="Zoom in">+</button><button data-act="zoomout" aria-label="Zoom out">−</button></div></div>
      <div class="legend" role="group" aria-label="Map key">
        <span><svg aria-hidden="true" viewBox="0 0 18 14"><circle cx="9" cy="7" r="5.5" fill="#f0ead6" stroke="#555"/></svg>Secure</span>
        <span><svg aria-hidden="true" viewBox="0 0 18 14"><circle cx="9" cy="7" r="5.5" fill="#e9c76b" stroke="#555"/></svg>Threatened</span>
        <span><svg aria-hidden="true" viewBox="0 0 18 14"><circle cx="9" cy="7" r="5.5" fill="#eaa05e" stroke="#555"/></svg>Infected, holding</span>
        <span><svg aria-hidden="true" viewBox="0 0 18 14"><circle cx="9" cy="7" r="5.5" fill="#d0532c" stroke="#555"/></svg>Infected, losing</span>
        <span><svg aria-hidden="true" viewBox="0 0 18 14"><circle cx="9" cy="7" r="5.5" fill="#24231f" stroke="#555"/></svg>Fallen</span>
        <span><svg aria-hidden="true" viewBox="0 0 18 14"><circle cx="9" cy="7" r="5.5" fill="#9a9686" stroke="#555"/></svg>Empty</span>
        <span><svg aria-hidden="true" viewBox="0 0 18 14"><circle cx="9" cy="7" r="6" fill="rgba(196,67,47,.25)" stroke="#c4432f" stroke-width="1.5"/></svg>Horde (size)</span>
        <span><svg aria-hidden="true" viewBox="0 0 18 14"><line x1="1" y1="7" x2="13" y2="7" stroke="#a3301f" stroke-width="2.5"/><path d="M12 3 L17 7 L12 11 z" fill="#a3301f"/></svg>Horde moving next turn</span>
        <span><svg aria-hidden="true" viewBox="0 0 18 14"><rect x="2" y="2" width="14" height="10" rx="1.5" fill="#3d5a78"/></svg>Battalions</span>
        <span><svg aria-hidden="true" viewBox="0 0 18 14"><circle cx="9" cy="7" r="4" fill="#8fb27a" stroke="#2c3a24"/></svg>Evacuating</span>
        <span><svg aria-hidden="true" viewBox="0 0 18 14"><circle cx="6" cy="7" r="4" fill="#fff" stroke="#2c3a24"/><path d="M11 3 L17 7 L11 11 z" fill="#2c3a24"/></svg>Refugee column</span>
        <span><svg aria-hidden="true" viewBox="0 0 18 14"><rect x="4" y="2" width="10" height="10" transform="rotate(45 9 7)" fill="none" stroke="#bbb" stroke-width="1.5"/></svg>Port</span>
        <span><svg aria-hidden="true" viewBox="0 0 18 14"><line x1="1" y1="7" x2="17" y2="7" stroke="#aaa" stroke-width="3.5"/><line x1="1" y1="7" x2="17" y2="7" stroke="#1c2326" stroke-width="1.5" stroke-dasharray="2 3"/></svg>Railway</span>
        <span><svg aria-hidden="true" viewBox="0 0 18 14"><line x1="1" y1="7" x2="17" y2="7" stroke="#9c8660" stroke-width="2.5"/></svg>Road</span>
      </div>
    </section>
    <div class="sheet" id="sheet" role="region" hidden></div>
    <aside class="side" id="side"></aside>
  </div>
</div>
<div class="cmdbar" id="cmdbar"></div>
<div id="overlay" class="overlay" hidden></div>

<script>
/* ---------- Vessmark ---------- */
// ls: label side (r/l/t/b), dx/dy: label nudge
const P={
  westhaven:{name:'Westhaven',type:'port',x:108,y:300,pop:60,T:1,prod:3,cap:16,ls:'t'},
  aldermoor:{name:'Aldermoor',type:'capital',x:250,y:335,pop:420,T:6,prod:6,ls:'r',dy:6},
  millbrook:{name:'Millbrook',type:'town',x:190,y:190,pop:25,ls:'l'},
  brindle:{name:'Brindle',type:'town',x:175,y:465,pop:18,ls:'l'},
  hollis:{name:'Hollis Farms',type:'farm',x:320,y:172,pop:8,prod:4,ls:'t'},
  cedar:{name:'Cedar Gap',type:'junction',x:372,y:298,pop:15,ls:'r',dy:8},
  ashford:{name:'Ashford',type:'town',x:385,y:445,pop:40,ls:'l'},
  brannock:{name:'Fort Brannock',type:'base',x:285,y:560,pop:10,T:4,ls:'l'},
  southport:{name:'Southport',type:'port',x:410,y:640,pop:90,T:2,prod:3,cap:12,ls:'b'},

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);

const ek=(a,b)=>[a,b].sort().join('|');

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ---------- state ---------- */
let S, UI={sel:null,mode:null,undo:[],setup:null,help:false,showReport:false};
function newGame(opts={}){
  const scenario=opts.scenario||'kessler',diff=opts.diff||'regular';
  const seed=Number.isFinite(opts.seed)?opts.seed:Math.floor(Math.random()*1e9);
  rng=mulberry(seed);const D=DIFFS[diff];

  for(const [id,p] of Object.entries(P))nodes[id]={pop:p.pop,H:0,T:p.T||0,F:0,stock:0,evac:false,evacT:-1,queue:0,sup:1,oos:0,wasFallen:false};
  let origin='kessler',cut=[],caps={},shift={};
  if(scenario==='random'){
    origin=ORIGINS[Math.floor(rng()*ORIGINS.length)];
    for(const id of PORTS)caps[id]=Math.round(P[id].cap*(.75+rng()*.5));
    const cand=E.filter(e=>!e.includes('aldermoor')&&!PORTS.some(p=>e.includes(p))&&!e.includes(origin));
    for(let i=0;i<2;i++){const e=cand.splice(Math.floor(rng()*cand.length),1)[0];cut.push(ek(e[0],e[1]));}
    for(const id of ['okafor','fuel','recall','navy','promise_hold','promise_evac','torrin'])shift[id]=Math.floor(rng()*3)-1;
  } else for(const id of PORTS)caps[id]=P[id].cap;
  for(const id of PORTS)caps[id]=Math.round(caps[id]*D.ships);
  const o=nodes[origin];o.H=origin==='kessler'?95+Math.round(rng()*20):Math.round(P[origin].pop*.9+15+rng()*10);
  if(origin==='kessler'){nodes.brennan.H=3;const spark=['harlow','torrin','dunmore'][Math.floor(rng()*3)];nodes[spark].H=2;}
  else{const ns=E.filter(e=>e.includes(origin)).map(e=>e[0]===origin?e[1]:e[0]);nodes[ns[Math.floor(rng()*ns.length)]].H=3;}
  S={seed,scenario,diff,origin,turn:0,cp:D.cp,cpMax:D.cp,supply:50,evacuated:0,lost:0,mobilized:0,tLost:0,cutT:-1,cutN:0,sorties:5,
     cut,cols:[],nodes,caps,shift,log:[],report:[],events:['briefing'],fired:{briefing:1},flags:{},bonusCap:{},over:null,
     order:70,conf:70,infRate:1+D.rate,intent:{},nextSpark:null,march:null,promises:[],moments:[],last:null,strikeKilled:0,initT:0,stamp:null};
  for(const id in P)S.initT+=nodes[id].T;
  for(const c of cut){const [a,b]=c.split('|');log(`Storm damage: the road between ${name(a)} and ${name(b)} is impassable.`);}

}
function log(text,kind=''){const t=S.stamp??S.turn;S.log.unshift({t,text,kind});if(S.log.length>150)S.log.length=150;S.report.push({text,kind});}
function moment(text,sev){S.moments.push({t:S.stamp??S.turn,text,sev});}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const r=localStorage.getItem(SAVE_KEY);if(r){const s=JSON.parse(r);if(s&&s.nodes&&s.cols&&s.caps)return s;}}catch(e){}return null;}
function morale(dOrder,dConf){S.order=clamp(S.order+dOrder,0,100);S.conf=clamp(S.conf+dConf,0,100);}

/* ---------- reading the situation ---------- */
const N=id=>S.nodes[id];
const defence=id=>{const n=N(id);return n.T*2.2*(n.sup??1)*(1+.5*n.F);};
const fallen=id=>{const n=N(id),alive=n.pop+n.queue;return n.H>=.5&&n.T<.3&&(alive<1||n.H>=alive*3);};
const held=id=>{const n=N(id);return n.H<.5||defence(id)>=n.H;};
function state(id){
  const n=N(id);
  if(fallen(id))return 'fallen';
  if(n.H>=.5)return held(id)?'holding':'losing';
  if(n.pop+n.queue<1&&n.T<.3)return 'cleared';
  if(nbrs(id).some(b=>N(b).H>=.5)||incoming(id)>0)return 'threat';
  return 'secure';
}
const STATE_LABEL={secure:'Secure',threat:'Threatened',holding:'Infected · holding',losing:'Infected · losing',fallen:'Fallen',cleared:'Empty'};
const infectedState=st=>st==='holding'||st==='losing';
const portOpen=id=>P[id].type==='port'&&!fallen(id);
const capOf=id=>(S.caps[id]||0)+(S.bonusCap[id]||0);
function supplyNet(){
  const seen=new Set();if(fallen('aldermoor'))return seen;
  const q=['aldermoor'];seen.add('aldermoor');
  while(q.length){const a=q.shift();for(const b of nbrs(a)){if(seen.has(b)||fallen(b))continue;seen.add(b);q.push(b);}}
  return seen;
}
function railReach(from){
  const seen=new Set([from]),q=[from];
  while(q.length){const a=q.shift();for(const b of nbrs(a)){if(seen.has(b)||!isRail(a,b)||N(b).H>=.5)continue;seen.add(b);q.push(b);}}
  seen.delete(from);return seen;
}
function moveTargets(from){const t=new Set(nbrs(from));for(const r of railReach(from))t.add(r);return t;}
const moveCost=(a,b)=>nbrs(a).includes(b)?1:(S.flags.ration?2:1);
function routeToPort(from){
  const dist={[from]:0},prev={},todo=new Set(Object.keys(P));
  while(todo.size){
    let u=null;for(const v of todo)if(dist[v]!==undefined&&(u===null||dist[v]<dist[u]))u=v;
    if(u===null)break;todo.delete(u);
    if(portOpen(u)){const path=[u];while(prev[path[0]])path.unshift(prev[path[0]]);return path;}
    for(const b of nbrs(u)){if(fallen(b))continue;const c=dist[u]+1+(N(b).H>=.5?3+N(b).H/8:0);if(dist[b]===undefined||c<dist[b]){dist[b]=c;prev[b]=u;}}
  }
  return null;
}
function routeTurns(path){let t=0,i=1;while(i<path.length){const rail=isRail(path[i-1],path[i]);t++;if(rail&&i+1<path.length&&isRail(path[i],path[i+1]))i+=2;else i++;}return t;}

/* ---------- forecast: what the hordes intend to do next turn ---------- */
function plan(){
  S.intent={};
  for(const id in P){if(N(id).H>=1)S.intent[id]=.8+rng()*.4;}
  const lvl=Math.min(S.infRate,SPARK_P.length-1);
  S.nextSpark=null;
  if(S.turn>=1&&rng()<SPARK_P[lvl]){
    const cand=Object.keys(P).filter(id=>N(id).H<.5&&N(id).pop>=3);
    if(cand.length){S.nextSpark={id:pickW(cand,cand.map(id=>Math.sqrt(N(id).pop))),size:(1.5+lvl*.8+rng()*2)*DIFFS[S.diff].spark};log(`Infected travellers sighted near ${name(S.nextSpark.id)}. Expect cases there next turn.`,'bad');}
  }
}
function spillOut(id,Hafter){const n=N(id);return Hafter*(n.pop+n.queue<1?.32:.13)*(S.intent[id]??1);}
function flows(){
  const out=[];
  for(const id in P){const n=N(id);if(n.H<1)continue;
    const est=Math.max(0,n.H-defence(id));if(est<1.5)continue;
    const ns=nbrs(id);if(!ns.length)continue;const amt=spillOut(id,est);
    const w=ns.map(b=>N(b).pop+4),tw=w.reduce((a,x)=>a+x,0);
    ns.forEach((b,i)=>{const a=amt*w[i]/tw;if(a>=.8)out.push({from:id,to:b,amt:a});});
  }
  return out;
}
function incoming(id){let s=0;for(const f of (UI._flows||[]))if(f.to===id)s+=f.amt;return s;}

/* ---------- orders ---------- */
function snapshot(){UI.undo.push(JSON.stringify(S));if(UI.undo.length>30)UI.undo.shift();}
function spend(c){if(S.cp<c)return false;snapshot();S.cp-=c;return true;}
function orderMove(from,to,amt){
  const c=moveCost(from,to);if(!moveTargets(from).has(to)||amt<=0||N(from).T<amt-1e-9||!spend(c))return;
  N(from).T-=amt;N(to).T+=amt;if(N(from).T<.05)N(from).T=0;
  log(`${bn(amt)} battalion${amt===1?'':'s'} ${nbrs(from).includes(to)?'march':'go by rail'} from ${name(from)} to ${name(to)}.`);
}
function orderAirdrop(id){if(S.supply<10||!spend(1))return;S.supply-=10;N(id).stock+=10;log(`Air drop: 10 supply to ${name(id)}.`);}
function orderFortify(id){const n=N(id);if(n.F>=3||S.supply<8||n.H>=.5||!spend(1))return;S.supply-=8;n.F++;log(`Engineers fortify ${name(id)} (level ${n.F}).`);}
function orderEvac(id){

  if(n.evac){snapshot();n.evac=false;if(n.evacT===S.turn){S.cp++;n.evacT=-1;}log(`Evacuation of ${name(id)} halted.`);return;}
  if(fallen(id)||n.pop<1||!spend(1))return;n.evac=true;n.evacT=S.turn;log(`Evacuation ordered for ${name(id)}.`,'key');
}
function orderMilitia(id){const n=N(id);if(n.pop<15||fallen(id)||!spend(1))return;n.pop-=10;n.T+=1;S.mobilized+=10;morale(-2,0);log(`${name(id)} raises a militia battalion from 10k volunteers.`);}
function orderStrike(id){const n=N(id);if(S.sorties<1||n.H<.5||!spend(2))return;S.sorties--;
  const kh=Math.min(n.H*.6,20),kc=n.pop*.15;n.H-=kh;n.pop-=kc;S.lost+=kc;S.strikeKilled+=kc;
  if(kc>=1){morale(-5,-2);moment(`Our own air strike killed ${kp(kc)} civilians in ${name(id)}.`,kc);}
  log(`Air strike on ${name(id)}: about ${kp(kh)} infected destroyed.${kc>=.5?` ${kp(kc)} civilians died with them.`:''}`,'bad');}
const cutsLeft=()=>S.cutT===S.turn?2-S.cutN:2;
function orderCut(a,b){

  if(S.cutT!==S.turn){S.cutT=S.turn;S.cutN=0;}S.cutN++;S.cut.push(ek(a,b));
  const trapped=S.cols.some(c=>c.at===a||c.at===b);if(trapped)morale(-4,0);
  log(`Engineers blow the ${isRail(a,b)?'rail bridge':'road'} between ${name(a)} and ${name(b)}.${trapped?' Refugees are stranded on the far side.':''}`,'key');
}
function undo(){const s=UI.undo.pop();if(s){S=JSON.parse(s);UI.mode=null;}}

/* ---------- the turn ---------- */
function endTurn(){

  S.report=[];const before={};for(const id in P)before[id]=state(id);
  const t=S.turn;S.stamp=t+1;rng=mulberry(S.seed+t*7919);
  const L={lostBy:{},sailed:{},prod:0,upkeep:0,arrivals:[],lost0:S.lost,evac0:S.evacuated,order0:S.order,conf0:S.conf};
  const lose=(id,v)=>{if(v<=0)return;S.lost+=v;L.lostBy[id]=(L.lostBy[id]||0)+v;};
  // 1. production
  for(const id in P)if(P[id].prod&&!fallen(id)&&N(id).pop>=1)L.prod+=P[id].prod;
  S.supply+=L.prod;
  // 2. supply
  const net=supplyNet();let demand=0;for(const id of net)demand+=N(id).T;
  const ratio=demand<=0?1:clamp(S.supply/demand,0,1);
  L.upkeep=Math.min(S.supply,demand);S.supply=Math.max(0,S.supply-demand);
  for(const id in P){const n=N(id);
    if(n.T<.05){n.sup=1;n.oos=0;continue;}
    if(net.has(id)){n.sup=.25+.75*ratio;n.oos=0;}
    else if(n.stock>=n.T){n.stock-=n.T;n.sup=1;n.oos=0;}
    else{n.stock=0;n.oos++;n.sup=Math.max(.25,1-.25*n.oos);const a=n.T*.04*n.oos;n.T-=a;S.tLost+=a;if(n.oos===1)log(`${name(id)} is cut off from supply.`,'bad');}
  }

  const convRate=S.flags.cure?.5:.9;

    const tl=Math.min(n.T,H0*.045/fort);n.T-=tl;S.tLost+=tl;

    const conv=Math.min(n.pop,n.pop*.16+.5,n.H*convRate*popF/(1+n.T*.1)+(n.H>0?.3:0));
    n.pop-=conv;n.H+=conv;lose(id,conv);

    if(n.queue>0&&n.H>=.5){const q=Math.min(n.queue,n.H*.12/(1+n.T*.1));n.queue-=q;n.H+=q;lose(id,q);}
  }

    if(n.H<1.5)continue;const ns=nbrs(id);if(!ns.length)continue;
    const out=spillOut(id,n.H);const w=ns.map(b=>N(b).pop+4),tw=w.reduce((a,x)=>a+x,0);
    ns.forEach((b,i)=>{const a=out*w[i]/tw;inflow[b]=(inflow[b]||0)+a;if(a>=2&&N(b).H<.5)L.arrivals.push(`A horde from ${name(id)} reached ${name(b)} (about ${kp(a)}).`);});n.H-=out;
  }

    const src=S.march.from,n=N(src),ns=nbrs(src);
    if(!ns.length||n.H<5){log(`The ${name(src)} horde surges and breaks against the blown bridges.`,'good');morale(0,5);}
    else{const amt=n.H*.45;n.H-=amt;const w=ns.map(b=>N(b).pop+N(b).queue+4),tw=w.reduce((a,x)=>a+x,0);
      ns.forEach((b,i)=>{N(b).H+=amt*w[i]/tw;});log(`The ${name(src)} horde is on the march: about ${kp(amt)} infected pour toward ${ns.map(name).join(', ')}.`,'bad');moment(`The ${name(src)} horde marched: ${kp(amt)} infected on the roads.`,amt);}

  }

  const keep=[];

    const path=routeToPort(c.at);
    if(!path){N(c.at).pop+=c.count;continue;}
    if(path.length===1){N(c.at).queue+=c.count;continue;}
    let i=1,steps=1,hurt=0;

      if(c.seed){const l=c.count*.03;c.count-=l;N(nx).H+=l;lose(nx,l);c.seed=false;}
      const n=N(nx);
      if(n.H>=.5){const f=n.H/(n.H+25+n.T*8)*.8,l=c.count*f;c.count-=l;n.H+=l*.8;lose(nx,l);hurt+=l;}
      if(portOpen(nx)){n.queue+=c.count;c.count=0;break;}

    }

    const cap=capOf(id)*(held(id)?1:.5);const m=Math.min(n.queue,cap);n.queue-=m;S.evacuated+=m;if(m>=.05)L.sailed[id]=m;

}
function sheltered(){let s=0;for(const id in P){const n=N(id);if(held(id)&&!fallen(id))s+=n.pop*.5+n.queue*.75;}for(const c of S.cols)if(held(c.at))s+=c.count*.5;return s;}

  let tot=0;for(const id in P)tot+=N(id).T;

  ];

}

// spoken name for a map place: what a sighted player reads off the disc, badge and labels
function nodeLabel(id,st,targets,cutTo){
  const p=P[id],d=N(id),m=UI.mode,inc=incoming(id),bits=[];
  bits.push(`${p.name}, ${TYPE_LABEL[p.type]}, ${STATE_LABEL[st]}`);
  bits.push(d.pop>=.5?`${kp(d.pop)} civilians`:'no civilians');
  if(d.H>=.5)bits.push(`${kp(d.H)} infected`);
  if(d.T>=.05)bits.push(`${bn(d.T)} battalion${bn(d.T)==='1'?'':'s'}`);
  if(d.F)bits.push(`fortified ${d.F}/3`);
  if(P[id].type==='port'&&d.queue>=.5)bits.push(`${kp(d.queue)} on the quay`);
  if(d.evac)bits.push('evacuating');
  if(inc>=.8)bits.push(`about ${kp(inc)} infected heading here`);
  if(S.nextSpark&&S.nextSpark.id===id)bits.push('new outbreak expected next turn');
  if(UI.sel===id)bits.push('selected');
  let s=bits.join(', ')+'.';
  if(m&&m.kind==='move'){if(targets&&targets.has(id))s+=` Press Enter to move ${bn(m.amt)} battalion${m.amt===1?'':'s'} here.`;else if(id===m.from)s+=' Moving troops from here; press Enter to cancel.';}
  if(m&&m.kind==='cut'&&cutTo&&cutTo.has(id))s+=` Press Enter to blow the ${isRail(m.from,id)?'rail bridge':'road'} from ${name(m.from)} to here.`;
  return s;
}
function modeText(){

  return `Pick a highlighted road or railway out of <b>${esc(name(m.from))}</b>, or the place at its other end, to destroy it. This can’t be undone and blocks your own people too.`;

function headline(){

  const bp=busiestPort();if(bp&&N(bp).queue>=10)opts.push(`Queues at ${name(bp)} stretch for miles: ${kp(N(bp).queue)} waiting for a ship.`);

function reportSection(){
  const L=S.last;if(!L)return '';
  const top=Object.entries(L.lostBy).sort((a,b)=>b[1]-a[1]).filter(e=>e[1]>=.5).slice(0,3);
  const sailed=Object.entries(L.sailed);
  const sgn=v=>v>=0?`+${Math.round(v)}`:`${Math.round(v)}`;
  const lines=[];
  lines.push({kind:'bad',text:`Lost ${kp(L.dLost)}${top.length?': '+top.map(([id,v])=>`${name(id)} ${kp(v)}`).join(', '):''}.`});
  lines.push({kind:'good',text:sailed.length?`Sailed ${kp(L.dEvac)}: ${sailed.map(([id,v])=>`${name(id)} ${kp(v)}`).join(', ')}.`:'No ships sailed.'});
  lines.push({kind:'',text:`Supply +${Math.round(L.prod)} produced, −${Math.round(L.upkeep)} upkeep. Public order ${sgn(L.dOrder)}, confidence ${sgn(L.dConf)}.`});
  for(const a of L.arrivals.slice(0,4))lines.push({kind:'bad',text:a});
  for(const r of S.report.filter(r=>r.kind).slice(0,8))lines.push(r);
  return lines;
}
function situation(){

  rows.sort((a,b)=>order[a.st]-order[b.st]||b.inc-a.inc||b.n.H-a.n.H||b.n.pop-a.n.pop);
  const onRoad=S.cols.reduce((a,c)=>a+c.count,0);
  const prom=S.promises.filter(p=>!p.done);

    <div class="sitlist">${rows.filter(r=>['losing','holding','threat'].includes(r.st)).map(r=>`<button data-act="select" data-id="${r.id}"><span>${esc(name(r.id))}${S.nextSpark&&S.nextSpark.id===r.id?' <span class="bad">!</span>':''}</span><em class="${r.st==='losing'||r.st==='fallen'?'bad':''}">${STATE_LABEL[r.st]}${r.n.H>=.5?' · '+kp(r.n.H):''}${r.inc>=.8?' · ~'+kp(r.inc)+' incoming':''} · ${bn(r.n.T)} bn</em></button>`).join('')||'<p class="note">No threats.</p>'}</div>

}

  } else if(UI.help){
    html=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="hh"><span class="eyebrow">Field manual</span><h2 id="hh">How to play</h2>${HELP}<div class="choices"><button class="btn primary" data-act="closehelp">Back to the map</button></div></div>`;
  } else if(S.over){
    const v=S.over;
    const txt={capital:'Aldermoor has fallen. The government is gone and with it the chain of command. Whatever is left of the army fights on in pockets, but the war is over.',confidence:'The cabinet has lost faith in you. You are relieved of command and flown out on the next ship. Someone else will make the last decisions.',ports:'The last port has fallen. There is nowhere left to send anyone.'}[v.why]||(v.pct>=58?'The last ships sail at dawn on Day 13, packed to the rails. Behind you, the line still holds. History will be kind to you.':v.pct>=46?'The last ships sail at dawn on Day 13. You got more people out than anyone had a right to expect, and the line held where it mattered.':v.pct>=32?'The last ships sail at dawn on Day 13, with room to spare that nobody could reach in time.':'The last ships sail at dawn on Day 13, half empty. Most of Vessmark never made it to the coast.');
    const worst=S.moments.slice().sort((a,b)=>b.sev-a.sev).slice(0,3);
    html=`<div class="card ${v.why==='time'&&v.pct>=32?'':'red'}" role="dialog" aria-modal="true" aria-labelledby="oh"><span class="eyebrow">${when(v.turn)} · After-action report · ${DIFFS[S.diff].name}</span><h2 id="oh">${esc(v.grade)}</h2><p class="body">${txt}</p>
      <div class="stats"><div><b>${Math.round(v.pct)}%</b><span>of ${Math.round(TOTAL_POP).toLocaleString()} thousand saved</span></div><div><b>${kp(S.evacuated)}</b><span>Evacuated by sea</span></div><div><b>${kp(v.sheltered+(v.milSaved||0))}</b><span>Credited behind your lines</span></div><div><b>${kp(v.stranded)}</b><span>Still alive in infected zones</span></div><div><b>${kp(S.lost+(v.milLost||0))}</b><span>Lost</span></div></div>
      <h3>Honours</h3><div class="medals">${v.medals.map(m=>`<span class="medal ${m.won?'won':''}">${m.won?'★ ':''}${esc(m.name)}</span>`).join('')}</div>
      ${worst.length?`<h3>Hardest moments</h3><ul>${worst.map(m=>`<li class="bad">${when(m.t)}: ${esc(m.text)}</li>`).join('')}</ul>`:''}
      <h3>What became of them</h3><ul>${epilogue().map(l=>`<li>${esc(l)}</li>`).join('')}</ul>
      <p class="note">Seed ${S.seed} · ${S.scenario==='random'?'Random outbreak':'Kessler'} scenario. Enter this seed in a new campaign to replay it.</p>
      <div class="choices"><button class="btn primary" data-act="restart" id="restart">Start a new campaign</button></div></div>`;
  } else if(S.events.length){
    const ev=EVENTS.find(e=>e.id===S.events[0]);
    html=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="evh"><span class="eyebrow">${esc(ev.eyebrow)}</span><h2 id="evh">${esc(evTitle(ev))}</h2><p class="body">${esc(ev.body())}</p>${ev.help?HELP:''}
      <div class="choices">${ev.choices().map((c,i)=>`<button class="btn ${i===0?'primary':''}" data-act="decide" data-i="${i}" ${c.dis?'disabled':''}>${esc(c.label)}${c.sub?`<small>${esc(c.sub)}</small>`:''}</button>`).join('')}</div></div>`;
  } else if(UI.showReport){
    const items=reportSection()||[];
    html=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="rh"><span class="eyebrow">${when(S.turn)}</span><h2 id="rh">Situation report</h2>
      <ul>${items.map(r=>`<li class="${r.kind}">${esc(r.text)}</li>`).join('')}</ul>
      <div class="choices"><button class="btn primary" data-act="closereport" id="closereport">To the map</button></div></div>`;
  }
  const was=!o.hidden;o.hidden=!html;o.innerHTML=html;
  if(html&&!o.contains(document.activeElement)){const f=o.querySelector('.choices .btn:not([disabled]),.seg .btn');if(f)f.focus({preventScroll:true});}
}
function epilogue(){
  const out=[];const f=S.flags;
  out.push(f.cure?'Dr Imani Okafor’s treatment became standard issue across the coalition. She never talks about St Brennan’s.':f.okafor==='escorted'?'Dr Okafor reached Westhaven, but her samples were lost on the road.':f.okafor==='refused'?'Dr Okafor was last seen in the St Brennan’s emergency department, still working.':'Nobody knows what became of Dr Okafor.');
  out.push(f.varga==='fellback'?(fallen('calder')?'Colonel Varga fell back to Port Calder and died on the quay wall.':'Colonel Varga held the Port Calder quays until the last ship sailed, then walked up the gangway last.'):f.varga==='held'?(fallen('torrin')?'Colonel Varga held Camp Torrin to the last man, as ordered.':'Against every expectation, Camp Torrin held. Varga was decorated twice.'):'Colonel Varga’s fate went unrecorded.');
  out.push(f.sealed?`The mayor of ${O()} never forgave the government for the bridges.`:`The mayor of ${O()} walked out with the last column from her city.`);
  const kept=S.promises.filter(p=>p.done==='kept').length,broke=S.promises.filter(p=>p.done==='broken').length;
  if(kept||broke)out.push(`You kept ${kept} of ${kept+broke} promise${kept+broke===1?'':'s'}. ${broke?'People remember the ones you broke.':'People remember that.'}`);
  return out;
}
function render(){
  // every render rebuilds the panels, so note what had keyboard focus and put it back afterwards
  const ae=document.activeElement,fk=focusKey(ae),fbox=boxOf(ae),wasOv=!$('#overlay').hidden;
  renderTop();renderMap();renderSide();renderOverlay();
  const ov=!$('#overlay').hidden;
  for(const el of [$('.wrap'),$('#sheet'),$('#cmdbar')])el.inert=ov; // dialogs are modal: nothing behind them can be tabbed to
  if(ov&&!wasOv)UI._ret=fk&&{k:fk,box:fbox};
  placeFocus(fk,fbox,wasOv,ov);
  announce();
  if(!UI.setup)save();
}
/* ---------- focus and announcements ---------- */
const BOXES='#overlay,#sheet,#cmdbar,#top,#side,#map,#modebar';
const boxOf=el=>el&&el.closest&&el.closest(BOXES)?.id||null;
function focusKey(el){
  if(!el||el===document.body||!el.dataset)return null;
  const d=el.dataset;
  if(d.node)return `[data-node="${d.node}"]`;
  if(d.edge)return `[data-edge="${d.edge}"]`;
  if(d.focus)return `[data-focus="${d.focus}"]`;
  if(d.act){let s=`[data-act="${d.act}"]`;for(const k of ['id','k','v','amt','i'])if(d[k]!=null)s+=`[data-${k}="${d[k]}"]`;return s;}
  return el.id?'#'+el.id:null;
}
function findFocus(sel,box){
  if(!sel)return null;let els;try{els=[...document.querySelectorAll(sel)];}catch(e){return null;}
  els=els.filter(el=>el.getClientRects().length&&!el.disabled&&!el.closest('[inert]'));
  return els.find(el=>boxOf(el)===box)||els[0]||null;
}
function placeFocus(fk,fbox,wasOv,ov){
  const want=UI._focus;UI._focus=null;
  if(ov){const el=findFocus(fk,fbox);if(el&&boxOf(el)==='overlay')el.focus({preventScroll:true});return;} // otherwise renderOverlay focused the first choice
  let el=null,scroll=false;
  if(wasOv){const r=UI._ret;UI._ret=null;el=r&&findFocus(r.k,r.box);if(!el)el=findFocus(UI.sel?`[data-node="${UI.sel}"]`:'#nodes [tabindex="0"]');}
  else if(want==='pick'&&UI.mode){
    // straight to the first place (or road) that can be picked, scrolled into view
    scroll=true;const m=UI.mode,box=$('#mapscroll'),k=$('#map').clientWidth/1000,A=P[m.from];
    box.scrollLeft=A.x*k-box.clientWidth/2;box.scrollTop=A.y*k-box.clientHeight/2;
    if(matchMedia('(max-width:700px)').matches)$('.mapbox').scrollIntoView({block:'start'});
    el=m.kind==='cut'?findFocus('[data-edge]'):findFocus(`[data-node="${[...moveTargets(m.from)][0]}"]`);
  }
  else if(want==='place')el=findFocus('[data-focus="place"]');
  else if(want)el=findFocus(want);
  if(!el&&fk){el=findFocus(fk,fbox);if(!el)el=UI.sel?findFocus('[data-focus="place"]')||findFocus(`[data-node="${UI.sel}"]`):findFocus('#nodes [tabindex="0"]');}
  if(el&&el!==document.activeElement)el.focus({preventScroll:!scroll});
}
const plain=html=>html.replace(/<[^>]+>/g,'');
function say(msg){const a=$('#announce');if(!a||!msg)return;a.textContent='';setTimeout(()=>{a.textContent=msg;},60);}
function announce(){
  // tell screen readers what just happened: the turn result, an order's dispatch, or how to pick a target
  if(UI.setup){UI._sig=null;return;}
  const sig={seed:S.seed,turn:S.turn,len:S.log.length,top:S.log[0]&&S.log[0].text,mode:UI.mode?JSON.stringify(UI.mode):''};
  const L=UI._sig;UI._sig=sig;
  let msg=UI._say||'';UI._say=null;
  const cpTxt=`${S.cp} order${S.cp===1?'':'s'} left.`;
  if(!msg&&L&&L.seed===sig.seed&&!S.over){
    if(sig.turn>L.turn){
      const rep=(reportSection()||[]).filter((r,i)=>i!==2).slice(0,5).map(r=>r.text);
      msg=`${when(S.turn)}, ${TURNS-S.turn} turn${TURNS-S.turn===1?'':'s'} left. ${rep.join(' ')} ${cpTxt}${S.events.length?' A decision is waiting.':''}`;
    } else if(sig.turn===L.turn&&(sig.len!==L.len||sig.top!==L.top)){
      const i=S.log.findIndex(l=>l.text===L.top);
      const fresh=i>0?S.log.slice(0,i):sig.len>L.len?S.log.slice(0,sig.len-L.len):[];
      if(fresh.length)msg=fresh.slice(0,3).reverse().map(l=>l.text).join(' ')+' '+cpTxt;
    } else if(sig.mode&&sig.mode!==L.mode)msg=plain(modeText())+' Use Tab or the arrow keys to choose, Enter to confirm, Escape to cancel.';
    else if(!sig.mode&&L.mode)msg='Cancelled.';
  }
  if(msg)say(msg);
}
// arrow keys on the map jump to the nearest place in that direction
function nodeStep(from,key){
  const dir={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[key];if(!dir)return null;
  const A=P[from];let best=null,bs=Infinity;
  for(const id in P){if(id===from)continue;const dx=P[id].x-A.x,dy=P[id].y-A.y,al=dx*dir[0]+dy*dir[1];if(al<=0)continue;const sc=al+2*Math.abs(dx*dir[1]-dy*dir[0]);if(sc<bs){bs=sc;best=id;}}
  return best;
}
function doUndo(){if(!UI.undo.length)return;undo();UI._say=`Last order undone. ${S.cp} order${S.cp===1?'':'s'} left.`;}

/* ---------- input ---------- */
function blocking(){return UI.setup||UI.help||S.over||S.events.length||UI.showReport;}
document.addEventListener('click',e=>{
  const b0=e.target.closest('[data-act]');
  if(S.over&&!UI.setup&&!(b0&&['restart','closehelp','help','zoomin','zoomout'].includes(b0.dataset.act)))return;
  const edge=e.target.closest('[data-edge]');
  if(edge&&!blocking()&&UI.mode&&UI.mode.kind==='cut'){UI._focus=`[data-node="${UI.mode.from}"]`;orderCut(UI.mode.from,edge.dataset.edge);UI.mode=null;render();return;}
  const nd=e.target.closest('[data-node]');
  if(nd&&!blocking()){
    const id=nd.dataset.node;
    if(UI.mode&&UI.mode.kind==='move'){if(moveTargets(UI.mode.from).has(id)){const cp=S.cp;orderMove(UI.mode.from,id,UI.mode.amt);if(S.cp===cp)UI._say='Not enough orders left for that move.';UI.mode=null;UI.sel=id;}else if(id===UI.mode.from)UI.mode=null;else UI._say=`${name(id)} can’t be reached from ${name(UI.mode.from)}. Pick a highlighted place, or press Escape to cancel.`;render();return;}
    if(UI.mode&&UI.mode.kind==='cut'){if(nbrs(UI.mode.from).includes(id)){orderCut(UI.mode.from,id);UI.mode=null;}render();return;}
    UI.sel=UI.sel===id?null:id;UI.mode=null;render();return;
  }
  const b=b0;if(!b||b.disabled)return;
  const a=b.dataset.act;if(a!=='new')UI.confirmNew=false;
  if(a==='prefreport'){PREFS.reportModal=b.checked;savePrefs();return;}
  const allowed=['decide','closereport','restart','new','setopt','start','cancelsetup','help','closehelp','zoomin','zoomout'];
  if(blocking()&&!allowed.includes(a))return;
  const id=UI.sel;
  switch(a){
    case 'restart':openSetup(false);break;
    case 'new':if(UI.confirmNew){UI.confirmNew=false;openSetup(true);}else UI.confirmNew=true;break;
    case 'setopt':UI.setup[b.dataset.k]=b.dataset.v;UI.setup.seed=readSeed();break;
    case 'start':{const sd=readSeed();newGame({scenario:UI.setup.scenario,diff:UI.setup.diff,seed:sd});UI.setup=null;UI.sel=null;UI.mode=null;UI.showReport=false;break;}
    case 'cancelsetup':UI.setup=null;break;
    case 'help':UI.help=true;break;
    case 'closehelp':UI.help=false;break;
    case 'zoomin':PREFS.zoom=Math.min(2.5,+(PREFS.zoom+.25).toFixed(2));savePrefs();break;
    case 'zoomout':PREFS.zoom=Math.max(1,+(PREFS.zoom-.25).toFixed(2));savePrefs();break;
    case 'decide':decide(+b.dataset.i);break;
    case 'closereport':UI.showReport=false;break;
    case 'end':UI.mode=null;endTurn();break;
    case 'undo':doUndo();break;
    case 'cancel':UI.mode=null;break;
    case 'select':UI.sel=b.dataset.id;UI.mode=null;UI._focus='place';break;
    case 'deselect':if(id)UI._focus=`[data-node="${id}"]`;UI.sel=null;UI.mode=null;break;
    case 'move':if(id){UI.mode={kind:'move',from:id,amt:+b.dataset.amt};UI._focus='pick';}break;
    case 'cut':if(id){UI.mode={kind:'cut',from:id};UI._focus='pick';}break;
    case 'evac':if(id)orderEvac(id);break;
    case 'fortify':if(id)orderFortify(id);break;
    case 'airdrop':if(id)orderAirdrop(id);break;
    case 'militia':if(id)orderMilitia(id);break;
    case 'strike':if(id)orderStrike(id);break;
  }
  render();
});
function readSeed(){const el=$('#seedinput');if(!el)return UI.setup&&UI.setup.seed;const v=el.value.trim();return v===''?null:Math.abs(parseInt(v,10))||null;}
function openSetup(canCancel){UI.setup={scenario:S?S.scenario:'kessler',diff:S?S.diff:'regular',seed:null,canCancel};}
document.addEventListener('keydown',e=>{
  if(e.target.matches&&e.target.matches('input'))return;
  if(e.key==='Escape'){
    if(UI.mode){if(!(e.target.closest&&e.target.closest('[data-node]')))UI._focus=`[data-node="${UI.mode.from}"]`;UI.mode=null;render();return;}
    if(UI.help){UI.help=false;render();return;}
    if(UI.setup&&UI.setup.canCancel&&S&&!S.over){UI.setup=null;render();return;}
    if(UI.showReport&&!S.events.length){UI.showReport=false;render();return;}
    if(UI.sel&&!blocking()){UI._focus=`[data-node="${UI.sel}"]`;UI.sel=null;render();return;}
  }
  const t=e.target.closest&&e.target.closest('[data-node],[data-edge]');
  if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}));return;}
  if(t&&t.dataset.node&&/^Arrow/.test(e.key)&&!e.altKey&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey){
    e.preventDefault();const to=nodeStep(t.dataset.node,e.key),el=to&&$(`#nodes [data-node="${to}"]`);if(el)el.focus();return;
  }
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='?'){UI.help=!UI.help;render();return;}
  if(e.key==='+'||e.key==='='){$('[data-act="zoomin"]').click();return;}
  if(e.key==='-'){$('[data-act="zoomout"]').click();return;}
  if(blocking())return;
  if(e.key==='e'||e.key==='E'){UI.mode=null;endTurn();render();}
  else if(e.key==='u'||e.key==='U'){doUndo();render();}
});
// the map has one tab stop that follows the focused place (plus every valid pick while choosing a destination or a road)
document.addEventListener('focusin',e=>{
  const nd=e.target.closest&&e.target.closest('#nodes [data-node]');if(!nd)return;
  UI._fnode=nd.dataset.node;
  for(const g of document.querySelectorAll('#nodes [data-node]'))g.setAttribute('tabindex',g===nd||g.hasAttribute('data-pick')?'0':'-1');
});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S)render();},120);});

/* ---------- boot ---------- */
function start(data){
  buildTerrain();
  S=(data&&data.S&&data.S.nodes&&data.S.caps)?data.S:load();
  UI=Object.assign({sel:null,mode:null,undo:[],setup:null,help:false,showReport:false},(data&&data.UI)||{});
  if(!S){newGame({});openSetup(false);}
  render();
}
window.claude?.hot?.snapshot?.(()=>({S,UI}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
